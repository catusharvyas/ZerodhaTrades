[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerodhatrades"
version = "0.1.0"
description = "Rule-driven trade automation for Zerodha (Kite Connect) with risk guardrails and paper trading by default."
requires-python = ">=3.10"
dependencies = [
  "kiteconnect>=5.0.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
zt = "zerodhatrades.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zerodhatrades = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
